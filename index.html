<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      background: #111821;
      border-bottom: 1px solid #26303b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #55e68b;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 120px;
    }

    .message {
      max-width: 88%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #1769ff;
      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-right: auto;
      background: #1b232d;
      border-bottom-left-radius: 5px;
    }

    .typing {
      opacity: 0.7;
      font-style: italic;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f151c;
      border-top: 1px solid #26303b;
      padding: 10px;
    }

    .voice-preview {
      display: none;
      color: #ffcc66;
      font-size: 13px;
      padding: 4px 8px 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: #202832;
      color: white;
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 16px;
      min-height: 48px;
      max-height: 120px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      background: #1769ff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 20px;
    }

    #micBtn {
      background: #252e38;
    }

    #micBtn.listening {
      background: #e53935;
      animation: pulse 1s infinite;
    }

    #sendBtn {
      background: #1769ff;
    }

    .tools {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .small-btn {
      width: auto;
      height: 34px;
      border-radius: 17px;
      padding: 0 14px;
      font-size: 13px;
      background: #202832;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <div class="title">🤖 My AI Assistant</div>
      <div class="status" id="status">● Online</div>
    </div>
  </header>

  <main id="chat"></main>

  <div class="bottom">

    <div id="voicePreview" class="voice-preview">
      🎤 Listening...
    </div>

    <div class="input-row">

      <textarea
        id="messageInput"
        placeholder="Ask anything..."
        rows="1"></textarea>

      <button id="micBtn" title="Voice input">
        🎤
      </button>

      <button id="sendBtn" title="Send">
        ➤
      </button>

    </div>

    <div class="tools">
      <button class="small-btn" onclick="clearChat()">
        🗑 Clear
      </button>

      <button class="small-btn" onclick="stopSpeaking()">
        🔇 Stop Voice
      </button>
    </div>

  </div>

</div>


<script>

  /* ==========================================
     CONFIGURATION
  ========================================== */

  const BACKEND_URL = "https://stant-q8rd.onrender.com";

  /*
    The frontend sends messages to:

       POST /api/chat

    Your backend should return JSON like:

       {
         "reply": "Hello!"
       }

    If your backend uses a different route,
    only change CHAT_ENDPOINT below.
  */

  const CHAT_ENDPOINT = BACKEND_URL + "/api/chat";


  /* ==========================================
     ELEMENTS
  ========================================== */

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const status = document.getElementById("status");
  const voicePreview = document.getElementById("voicePreview");


  /* ==========================================
     MEMORY
  ========================================== */

  let memory = JSON.parse(
    localStorage.getItem("ai_memory") || "[]"
  );


  function saveMemory() {

    localStorage.setItem(
      "ai_memory",
      JSON.stringify(memory.slice(-30))
    );

  }


  function addToMemory(role, content) {

    memory.push({
      role: role,
      content: content
    });

    saveMemory();

  }


  /* ==========================================
     CHAT DISPLAY
  ========================================== */

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
  }


  function showWelcome() {

    if (chat.children.length === 0) {

      addMessage(
        "👋 Hello! I'm your AI assistant.\n\nYou can type or use 🎤 voice input.\n\nతెలుగులో కూడా మాట్లాడవచ్చు.",
        "ai"
      );

    }

  }


  showWelcome();


  /* ==========================================
     SEND MESSAGE
  ========================================== */

  async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    input.value = "";

    input.style.height = "48px";

    addMessage(text, "user");

    addToMemory("user", text);

    const typing = addMessage(
      "🤖 Thinking...",
      "ai typing"
    );

    status.textContent = "● Thinking...";
    status.style.color = "#ffcc66";


    try {

      const response = await fetch(CHAT_ENDPOINT, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message: text,

          language: detectLanguage(text),

          history: memory.slice(-20)

        })

      });


      if (!response.ok) {

        throw new Error(
          "Server returned " + response.status
        );

      }


      const data = await response.json();


      typing.remove();


      const reply =
        data.reply ||
        data.response ||
        data.message ||
        "I received your message, but the server didn't return a reply.";


      addMessage(reply, "ai");

      addToMemory("assistant", reply);

      speak(reply);

      status.textContent = "● Online";
      status.style.color = "#55e68b";


    } catch (error) {

      console.error(error);

      typing.remove();

      addMessage(
        "❌ I couldn't connect to the AI backend.\n\nPlease check whether the Render backend is running.",
        "ai"
      );

      status.textContent = "● Backend Error";
      status.style.color = "#ff5555";

    }

  }


  /* ==========================================
     LANGUAGE DETECTION
  ========================================== */

  function detectLanguage(text) {

    const teluguPattern =
      /[\u0C00-\u0C7F]/;

    if (teluguPattern.test(text)) {

      return "te";

    }

    return "en";

  }


  /* ==========================================
     SEND BUTTON
  ========================================== */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  /* ==========================================
     ENTER KEY
  ========================================== */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* ==========================================
     AUTO RESIZE TEXTAREA
  ========================================== */

  input.addEventListener(
    "input",
    function() {

      this.style.height = "48px";

      this.style.height =
        Math.min(
          this.scrollHeight,
          120
        ) + "px";

    }
  );


  /* ==========================================
     VOICE INPUT
  ========================================== */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  let recognition = null;

  let isListening = false;

  let finalTranscript = "";

  let silenceTimer = null;


  if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.lang = "en-IN";


    recognition.onstart = function() {

      isListening = true;

      finalTranscript = "";

      micBtn.classList.add("listening");

      micBtn.textContent = "⏹";

      voicePreview.style.display = "block";

      voicePreview.textContent =
        "🎤 Listening...";

    };


    recognition.onresult = function(event) {

      let interim = "";

      finalTranscript = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0].transcript;

        if (
          event.results[i].isFinal
        ) {

          finalTranscript += transcript;

        } else {

          interim += transcript;

        }

      }


      voicePreview.textContent =
        "🎤 " +
        (finalTranscript || interim);


      /*
        Stop automatically after the browser
        gives us the final sentence.
      */

      if (finalTranscript.trim()) {

        input.value =
          finalTranscript.trim();

        clearTimeout(silenceTimer);

        silenceTimer = setTimeout(
          stopListening,
          700
        );

      }

    };


    recognition.onerror = function(event) {

      console.log(
        "Speech error:",
        event.error
      );

      stopListening();

    };


    recognition.onend = function() {

      isListening = false;

      micBtn.classList.remove(
        "listening"
      );

      micBtn.textContent = "🎤";

      voicePreview.style.display =
        "none";


      /*
        IMPORTANT:
        Do NOT automatically restart
        recognition.

        This prevents the microphone from
        continuing after you finish speaking.
      */

    };


  } else {

    micBtn.disabled = true;

    micBtn.textContent = "🚫";

  }


  /* ==========================================
     MIC BUTTON
  ========================================== */

  micBtn.addEventListener(
    "click",
    function() {

      if (!recognition) {

        alert(
          "Voice input is not supported in this browser."
        );

        return;

      }


      if (isListening) {

        stopListening();

      } else {

        startListening();

      }

    }
  );


  function startListening() {

    try {

      finalTranscript = "";

      recognition.lang = "en-IN";

      recognition.start();

    } catch (error) {

      console.log(error);

    }

  }


  function stopListening() {

    clearTimeout(silenceTimer);

    silenceTimer = null;


    if (recognition && isListening) {

      recognition.stop();

    }


    isListening = false;

    micBtn.classList.remove(
      "listening"
    );

    micBtn.textContent = "🎤";

    voicePreview.style.display =
      "none";


    /*
      Put the final spoken text in the
      input box but DON'T automatically
      send it.

      User can check it and press send.
    */

    if (finalTranscript.trim()) {

      input.value =
        finalTranscript.trim();

    }

  }


  /* ==========================================
     TEXT TO SPEECH
  ========================================== */

  let speechUtterance = null;


  function speak(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      return;

    }


    speechSynthesis.cancel();


    speechUtterance =
      new SpeechSynthesisUtterance(text);


    const isTelugu =
      detectLanguage(text) === "te";


    if (isTelugu) {

      speechUtterance.lang =
        "te-IN";

    } else {

      speechUtterance.lang =
        "en-IN";

    }


    speechUtterance.rate = 0.95;

    speechUtterance.pitch = 1;


    speechSynthesis.speak(
      speechUtterance
    );

  }


  function stopSpeaking() {

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();

    }

  }


  /* ==========================================
     CLEAR CHAT
  ========================================== */

  function clearChat() {

    const confirmClear =
      confirm(
        "Clear chat and memory?"
      );

    if (!confirmClear) return;


    memory = [];

    localStorage.removeItem(
      "ai_memory"
    );

    chat.innerHTML = "";

    stopSpeaking();

    showWelcome();

  }


  /* ==========================================
     PAGE VISIBILITY
  ========================================== */

  document.addEventListener(
    "visibilitychange",
    function() {

      if (document.hidden) {

        stopSpeaking();

        if (isListening) {

          stopListening();

        }

      }

    }
  );

</script>

</body>
</html>
